name: CI

on:
  push:
    branches: [master] # default branch only; feature-branch pushes are covered by the PR event
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt

      - name: Install sbt 1.9.9 (matches project/build.properties)
        run: |
          curl -fsSL -o sbt.tgz https://github.com/sbt/sbt/releases/download/v1.9.9/sbt-1.9.9.tgz
          sudo tar -xzf sbt.tgz -C /opt
          echo "/opt/sbt/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: sbt test stage
